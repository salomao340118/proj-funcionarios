<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Startup - Funcionários</title>
</head>
<body>
  <h1>Gestão de Funcionários</h1>

  <!-- Formulário de cadastro (a validação é feita no script.js) -->
  <form id="form-funcionario">
    <label>Nome:
      <input type="text" id="nome" maxlength="100">
    </label><br><br>

    <!-- Idade: inteiro de 14 a 100 -->
    <label>Idade:
      <input type="number" id="idade" min="14" max="100" step="1">
    </label><br><br>

    <label>Cargo:
      <input type="text" id="cargo" maxlength="60">
    </label><br><br>

    <!-- Salário: maior que zero, com até 2 casas decimais -->
    <label>Salário (R$):
      <input type="number" id="salario" min="0.01" max="1000000" step="0.01">
    </label><br><br>

    <button type="button" id="btn-salvar">Cadastrar</button>
  </form>

  <h2>Funcionários cadastrados</h2>

  <label>Buscar por nome:
    <input type="text" id="busca">
  </label><br><br>

  <table border="1" cellpadding="5">
    <thead>
      <tr>
        <th>ID</th><th>Nome</th><th>Idade</th><th>Cargo</th><th>Salário</th><th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-funcionarios"></tbody>
  </table>

  <!-- >>> MUDANÇA (Exercício 4): SEÇÃO NOVA de relatórios (botões + área de resultado) -->
  <h2>Relatórios</h2>
  <button id="btn-salario-alto">Salário maior que R$ 5.000</button>
  <button id="btn-media-salarial">Média salarial</button>
  <button id="btn-cargos-unicos">Cargos únicos</button>
  <button id="btn-nomes-maiusculos">Nomes em maiúsculo</button>

  <!-- Área onde o resultado do relatório é exibido -->
  <div id="resultado-relatorio"></div>
  <!-- >>> FIM DA MUDANÇA (Exercício 4) -->

  <!-- funcionario.js precisa vir ANTES do script.js, pois o script usa a classe -->
  <script src="funcionario.js"></script>
  <script src="script.js"></script>
</body>
</html>
